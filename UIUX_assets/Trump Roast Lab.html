<style>
  /* Lab-grid responsive collapse */
  @media (max-width: 1180px) {
    .lab-grid { grid-template-columns: 1fr 1fr !important; }
    .lab-grid > section:nth-child(3) { grid-column: 1 / -1; }
  }
  @media (max-width: 800px) {
    .lab-grid { grid-template-columns: 1fr !important; }
  }

  /* App background warmth */
  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(184,137,58,0.05), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(14,34,56,0.04), transparent 50%),
      var(--ivory);
  }
</style>
